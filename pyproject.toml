[project]
name = "comic-translate"
version = "0.1.0"
description = "Fork local-first de comic-translate : traduction de BD depuis les sources, sans compte, avec un traducteur Custom adapté à Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- sync_deps: begin ---
    "mahotas>=1.4.18",
    "pillow>=11.3.0",
    "numpy>=2.2.6",
    "setuptools",
    "pyside6-essentials>=6.8.0",
    "msgpack>=1.1.0",
    "requests>=2.31.0",
    "py7zr>=0.20.8",
    "rarfile>=4.1",
    "pypdfium2>=5.8.0",
    "azure-ai-vision-imageanalysis>=1.0.0b1",
    "deepl>=1.16.1",
    "deep-translator>=1.11.4",
    "jaconv>=0.3.4",
    "wget>=3.2",
    "onnxruntime>=1.22.1",
    "shapely>=2.1.1",
    "pyclipper>=1.3.0.post6",
    "six>=1.16.0",
    "PhotoshopAPI>=0.9.0",
    "send2trash>=2.1.0",
    "certifi>=2024.2.2",
    # --- sync_deps: end ---
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-qt==4.4.0", "pyyaml", "packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# fork : les fichiers d'origine (amont) ne doivent JAMAIS être reformatés — règle « # fork: », rebase.
# Seuls les modules créés par le fork sont formatés/lintés. force-exclude s'applique même aux
# chemins passés explicitement (hook Edit/Write).
# `modules/cleaning/` est du code du fork (pas d'origine) : il doit rester linté. Ruff ne traite
# PAS la négation ("!motif") dans extend-exclude comme .gitignore le ferait pour un sous-dossier
# d'un chemin déjà exclu (vérifié : `!modules/cleaning/` reste sans effet, la marche de l'arbre
# s'arrête à `modules/`) — on énumère donc explicitement les sous-dossiers d'origine de `modules/`
# au lieu d'exclure `modules/` en bloc.
force-exclude = true
extend-exclude = [
    "app/",
    "modules/detection/",
    "modules/inpainting/",
    "modules/ocr/",
    "modules/rendering/",
    "modules/translation/",
    "modules/utils/",
    "modules/__init__.py",
    "pipeline/",
    "imkit/",
    "controller.py",
    "comic.py",
    "tests/test_app.py",
]
line-length = 100
